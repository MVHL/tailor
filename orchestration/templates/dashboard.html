<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__AG_TITLE__</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2b3444;
    --ink:#e6edf3; --dim:#9aa7b4; --faint:#6b7684;
    --good:#2ea043; --amber:#d29922; --red:#e5534b; --blue:#4c8dff;
    --violet:#a371f7; --teal:#1f9c9c; --human:#e3b341;
  }
  body{background:var(--bg);color:var(--ink);line-height:1.5;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:1.4rem 1.2rem 4rem}
  a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  header.top{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;margin-bottom:.5rem}
  h1{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
  .sub{font-size:.74rem;color:var(--faint)}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--good);
    display:inline-block;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ── KPI strip ── */
  .kpis{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0 1rem}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:.5rem .8rem;min-width:104px}
  .kpi .n{font-size:1.3rem;font-weight:800;line-height:1.1}
  .kpi .l{font-size:.63rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .kpi.warn .n{color:var(--human)} .kpi.bad .n{color:var(--red)}

  section{margin-bottom:1.5rem}
  h2{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
    color:var(--faint);margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem}
  h2 .count{background:var(--panel2);border:1px solid var(--line);border-radius:20px;
    padding:0 .45rem;font-size:.62rem;color:var(--dim)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px}
  .empty{padding:.9rem 1rem;color:var(--faint);font-size:.78rem}

  /* ── charters ── */
  .charter{padding:.75rem .9rem;border-bottom:1px solid var(--line)}
  .charter:last-child{border-bottom:none}
  .charter-head{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap}
  .cid{font-weight:800;color:var(--violet)}
  .charter .thesis{font-size:.78rem;color:var(--dim);margin:.25rem 0 .5rem}
  .slices{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.35rem}
  .sl{border:1px solid var(--line);border-radius:6px;padding:.18rem .45rem;font-size:.68rem;
    background:var(--panel2);display:inline-flex;gap:.35rem;align-items:center}
  .sl.done{border-color:var(--good);color:#9ae6a8}
  .sl.inflight{border-color:var(--blue);color:#a8c9ff}
  .sl.cut{opacity:.5;text-decoration:line-through}
  .sl .slid{font-weight:800}
  .burn{height:5px;background:var(--panel2);border-radius:4px;overflow:hidden;
    margin:.45rem 0 .3rem;max-width:320px}
  .burn i{display:block;height:100%;background:var(--violet)}

  /* ── grid ── */
  .gridwrap{overflow-x:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px}
  th,td{padding:.3rem .35rem;text-align:left;vertical-align:middle}
  thead th{position:sticky;top:0;background:var(--bg);z-index:2;font-size:.6rem;
    text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;
    border-bottom:1px solid var(--line);padding-bottom:.45rem;white-space:nowrap}
  thead th.step{text-align:center;width:44px}
  thead th.step.human{color:var(--human)}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr:hover{background:#141a24}
  td.item{min-width:250px}
  .iid{font-weight:800;font-family:ui-monospace,Menlo,monospace;font-size:.74rem}
  .ititle{font-size:.78rem}
  .meta{font-size:.64rem;color:var(--faint);display:flex;gap:.4rem;flex-wrap:wrap;
    align-items:center;margin-top:1px}
  .tag{border:1px solid var(--line);border-radius:5px;padding:0 .3rem;font-size:.6rem;
    background:var(--panel2);color:var(--dim)}
  .tag.chart{color:#c9a6ff;border-color:#4b3a6b}
  .tag.rej{color:var(--faint)}

  .cell{width:44px;text-align:center}
  .dot{width:26px;height:22px;border-radius:6px;display:inline-flex;align-items:center;
    justify-content:center;font-size:.6rem;font-weight:800;border:1px solid var(--line);
    background:var(--panel2);color:var(--faint);cursor:pointer}
  .dot.done{background:rgba(46,160,67,.16);border-color:var(--good);color:#9ae6a8}
  .dot.current{background:rgba(76,141,255,.16);border-color:var(--blue);color:#a8c9ff}
  .dot.waiting{background:rgba(227,179,65,.18);border-color:var(--human);color:#f0d284}
  .dot.pending{opacity:.45}
  .dot.skipped{opacity:.3}
  .dot.na{opacity:.14;cursor:default}
  .dot.low{background:rgba(229,83,75,.16);border-color:var(--red);color:#ffb3ae}
  .dot .f{color:var(--red)}

  .scorecol{width:52px;text-align:right;font-weight:800;font-size:.76rem}
  .s-hi{color:#9ae6a8}.s-mid{color:#f0d284}.s-lo{color:#ffb3ae}.s-na{color:var(--faint);font-weight:400}
  .att{font-size:.66rem;color:var(--human);max-width:190px}
  .att.bad{color:var(--red)}

  /* ── threads ── */
  .thread{padding:.4rem .8rem;border-bottom:1px solid var(--line);display:flex;gap:.5rem;
    align-items:baseline;font-size:.76rem}
  .thread:last-child{border-bottom:none}
  .tk{font-weight:800;font-size:.6rem;border-radius:4px;padding:.05rem .3rem;flex-shrink:0}
  .tk.ASM{background:rgba(163,113,247,.18);color:#c9a6ff}
  .tk.OQ{background:rgba(76,141,255,.18);color:#a8c9ff}
  .thread .who{color:var(--faint);font-size:.66rem;flex-shrink:0}
  .thread.block{background:rgba(229,83,75,.07)}
  .thread.block .flag{color:var(--red);font-size:.62rem;font-weight:800}

  /* ── drawer ── */
  .drawer{position:fixed;inset:0 0 0 auto;width:min(560px,94vw);background:var(--panel);
    border-left:1px solid var(--line);padding:1rem 1.1rem 3rem;overflow-y:auto;
    transform:translateX(100%);transition:transform .18s ease;z-index:20}
  .drawer.open{transform:none}
  .drawer h3{font-size:.95rem;font-weight:800;margin-bottom:.15rem}
  .drawer .x{position:absolute;top:.6rem;right:.8rem;cursor:pointer;color:var(--faint);
    font-size:1.1rem;background:none;border:none}
  .io{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.8rem 0}
  .io h4{font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
    margin-bottom:.3rem}
  .chip{display:block;border:1px solid var(--line);border-radius:6px;padding:.25rem .45rem;
    font-size:.7rem;background:var(--panel2);margin-bottom:.25rem}
  .chip .st{font-size:.6rem;color:var(--faint);float:right}
  .chk{display:flex;justify-content:space-between;gap:.5rem;font-size:.71rem;
    padding:.22rem 0;border-bottom:1px dashed var(--line)}
  .chk:last-child{border-bottom:none}
  .chk .r{font-weight:800;flex-shrink:0}
  .chk .d{color:var(--faint);font-size:.65rem}
  .fnd{font-size:.72rem;padding:.3rem 0;border-bottom:1px dashed var(--line)}
  .fnd .sev{font-weight:800;font-size:.6rem;text-transform:uppercase}
  .sev.blocker,.sev.high{color:var(--red)} .sev.medium{color:var(--human)}
  .sev.low{color:var(--faint)}
  .note{font-size:.68rem;color:var(--faint);border-left:2px solid var(--line);
    padding-left:.55rem;margin-top:.7rem}
  .controls{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
  select,button.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:.25rem .5rem;font-size:.72rem;font-family:inherit}
  .legend{font-size:.64rem;color:var(--faint);display:flex;gap:.7rem;flex-wrap:wrap;
    margin-top:.4rem}
</style>
</head>
<body>

<header class="top">
  <h1 id="title">__AG_TITLE__</h1>
  <span class="sub" id="scanline"></span>
</header>

<div class="kpis" id="kpis"></div>

<section>
  <h2>Charters <span class="count" id="c-count">0</span></h2>
  <div class="card" id="charters"></div>
</section>

<section>
  <h2>Items × steps <span class="count" id="i-count">0</span></h2>
  <div class="controls">
    <select id="f-repo"><option value="">all repos</option></select>
    <select id="f-status">
      <option value="">all statuses</option>
      <option value="attention">needs attention</option>
      <option value="human">waiting on human</option>
      <option value="live">running now</option>
      <option value="rejected">rejected</option>
      <option value="done">done</option>
    </select>
    <select id="sort">
      <option value="attention">sort: attention first</option>
      <option value="id">sort: id</option>
      <option value="framing">sort: framing score</option>
      <option value="output">sort: output score</option>
    </select>
  </div>
  <div class="gridwrap card"><table id="grid"></table></div>
  <div class="legend">
    <span>■ done</span><span>■ current</span><span style="color:var(--human)">■ waiting on human</span>
    <span>□ pending</span><span>▫ skipped/optional</span>
    <span>score = derived, never hand-written</span>
    <span>click a cell for its IN/OUT artifacts</span>
  </div>
</section>

<section>
  <h2>Open threads <span class="count" id="t-count">0</span></h2>
  <div class="card" id="threads"></div>
</section>

<div class="drawer" id="drawer"><button class="x" onclick="closeDrawer()">✕</button>
  <div id="drawer-body"></div>
</div>

<script>
let PAYLOAD = /*__AG_DATA__*/null;
const LIVE = /*__AG_LIVE__*/false;

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const sClass = v => v == null ? "s-na" : v >= 80 ? "s-hi" : v >= 60 ? "s-mid" : "s-lo";
const sText  = v => v == null ? "—" : v;

/* ── KPIs ── */
function renderKpis(){
  const it = PAYLOAD.items.filter(i => !i.synthetic);
  const human = it.filter(i => i.waiting).length;
  const live = it.filter(i => i.live).length;
  const att = it.filter(i => i.needsAttention && !i.waiting).length;
  const scored = it.map(i => i.framingScore).filter(v => typeof v === "number");
  const avg = scored.length ? Math.round(scored.reduce((a,b)=>a+b,0)/scored.length) : null;
  const rej = it.filter(i => i.status === "rejected").length;
  const k = [
    ["items", it.length, ""],
    ["running now", live, live ? "warn" : ""],
    ["waiting on human", human, human ? "warn" : ""],
    ["needs attention", att, att ? "bad" : ""],
    ["avg framing", avg == null ? "—" : avg, ""],
    ["open threads", PAYLOAD.threads.length, ""],
    ["rejected", rej, ""],
  ];
  document.getElementById("kpis").innerHTML = k.map(([l,n,c]) =>
    `<div class="kpi ${c}"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join("");
  document.getElementById("scanline").innerHTML =
    (LIVE ? '<span class="live-dot"></span> live · ' : '') +
    esc(PAYLOAD.repos.length) + " repo(s) · " + esc(PAYLOAD.charters.length) + " charter(s)";
}

/* ── charters ── */
function renderCharters(){
  const el = document.getElementById("charters");
  document.getElementById("c-count").textContent = PAYLOAD.charters.length;
  if(!PAYLOAD.charters.length){
    el.innerHTML = '<div class="empty">No charters. Most work needs only epic + task —' +
      ' a charter exists only when one ask exceeds a single epic.</div>';
    return;
  }
  el.innerHTML = PAYLOAD.charters.map(c => {
    const burn = c.burn == null ? "" :
      `<div class="burn"><i style="width:${Math.min(100, Math.round(c.burn*100))}%"></i></div>
       <div class="sub">${c.minted}/${c.appetiteSlices} slices minted</div>`;
    const slices = c.slices.map(s => {
      const cls = s.state === "done" ? "done" : s.state === "in-flight" ? "inflight"
        : s.state === "cut" ? "cut" : "";
      return `<span class="sl ${cls}" title="${esc(s.hypothesis || s.title)}${
        s.reduces ? " · reduces " + esc(s.reduces) : ""}${
        s.needs.length ? " · needs " + esc(s.needs.join(",")) : ""}">
        <span class="slid">${esc(s.id)}</span>${esc(s.minted || s.state)}</span>`;
    }).join("");
    const wait = c.waiting ? `<span class="tag" style="color:var(--human)">waiting ${esc(c.waiting)}</span>` : "";
    return `<div class="charter">
      <div class="charter-head"><span class="cid">${esc(c.id)}</span>
        <strong>${esc(c.title)}</strong>
        <span class="tag">${esc(c.status || "draft")}</span>
        ${c.appetite ? `<span class="tag">appetite ${esc(c.appetite)}</span>` : ""}
        ${c.review_after ? `<span class="tag">re-bet after ${esc(c.review_after)}</span>` : ""}
        ${wait}
        <span class="scorecol ${sClass(c.score)}">${sText(c.score)}</span></div>
      ${burn}
      <div class="slices">${slices || '<span class="sub">no slices recorded</span>'}</div>
      ${c.unknowns.length ? `<div class="sub" style="margin-top:.35rem">top unknown:
        <b>${esc(c.unknowns[0].id)}</b> ${esc(c.unknowns[0].text)}</div>` : ""}
    </div>`;
  }).join("");
}

/* ── grid ── */
function stepCell(item, step){
  const s = item.steps && item.steps[step.id];
  if(!s) return '<td class="cell"><span class="dot na">·</span></td>';
  let cls = s.state === "done" ? "done" : s.state === "current" ? "current"
    : s.state === "waiting" ? "waiting" : s.state === "skipped" ? "skipped"
    : s.state === "n/a" ? "na" : "pending";
  if(s.score != null && s.score < 60) cls += " low";
  const label = s.score != null ? s.score : (s.state === "done" ? "✓"
    : s.state === "waiting" ? "⏸" : s.state === "skipped" ? "–" : "·");
  const f = s.findings ? `<span class="f">•</span>` : "";
  return `<td class="cell"><span class="dot ${cls}" title="${esc(step.label)} — ${esc(s.state)}${
    s.score != null ? " · score " + s.score : ""}${s.findings ? " · " + s.findings + " finding(s)" : ""}"
    onclick='openStep(${JSON.stringify(item.repo)},${JSON.stringify(item.id)},${JSON.stringify(step.id)})'
    >${label}${f}</span></td>`;
}

function visibleItems(){
  const repo = document.getElementById("f-repo").value;
  const st = document.getElementById("f-status").value;
  const sort = document.getElementById("sort").value;
  let out = PAYLOAD.items.filter(i => !repo || i.repo === repo).filter(i => {
    if(st === "attention") return i.needsAttention;
    if(st === "human") return !!i.waiting;
    if(st === "live") return !!i.live;
    if(st === "rejected") return i.status === "rejected";
    if(st === "done") return i.status === "done";
    return true;
  });
  const rank = i => (i.live ? 0 : i.waiting ? 1 : i.needsAttention ? 2 : 3);
  out.sort((a,b) => {
    if(sort === "id") return String(a.id).localeCompare(String(b.id), undefined, {numeric:true});
    if(sort === "framing") return (b.framingScore ?? -1) - (a.framingScore ?? -1);
    if(sort === "output") return (b.outputScore ?? -1) - (a.outputScore ?? -1);
    return rank(a) - rank(b) || String(a.id).localeCompare(String(b.id), undefined, {numeric:true});
  });
  return out;
}

function renderGrid(){
  const items = visibleItems();
  document.getElementById("i-count").textContent = items.length;
  const head = `<thead><tr><th>item</th>` +
    PAYLOAD.steps.map(s => `<th class="step ${s.id[0]==="H"?"human":""}" title="${esc(s.label)}">${esc(s.id)}</th>`).join("") +
    `<th class="scorecol">frm</th><th class="scorecol">out</th><th>attention</th></tr></thead>`;
  const rows = items.map(i => {
    const tags = [
      i.type ? `<span class="tag">${esc(i.type)}</span>` : "",
      i.form === "collapsed" ? `<span class="tag">collapsed</span>` : "",
      i.charter ? `<span class="tag chart">${esc(i.charter)}${i.slice ? "·" + esc(i.slice.split("#").pop()) : ""}</span>` : "",
      i.status === "rejected" ? `<span class="tag rej">rejected: ${esc(i.rejection_reason)} @${esc(i.rejection_stage)}</span>` : "",
      i.live ? `<span class="live-dot"></span>` : "",
      i.tests ? `<span class="tag">tests ${esc(i.tests)}</span>` : "",
      /* coverage is shown as its own number, never folded into a score: it is the highest-
         leverage figure in the system and a pooled mean dilutes it out of visibility. */
      (typeof i.coverage === "number" && i.coverage < 100)
        ? `<span class="tag" style="color:var(--human);border-color:#6b5a2b">coverage ${esc(i.coverage)}%</span>` : "",
    ].join(" ");
    const att = i.attention ? `<td class="att ${/blocked|failing|bugs|low output/.test(i.attention)?"bad":""}">${esc(i.attention)}</td>` : "<td></td>";
    return `<tr>
      <td class="item"><span class="iid">${esc(i.id)}</span>
        <span class="ititle">${esc(i.title)}</span>
        <div class="meta">${esc(i.repo)} ${tags}</div></td>
      ${PAYLOAD.steps.map(s => stepCell(i, s)).join("")}
      <td class="scorecol ${sClass(i.framingScore)}">${sText(i.framingScore)}</td>
      <td class="scorecol ${sClass(i.outputScore)}">${sText(i.outputScore)}</td>
      ${att}</tr>`;
  }).join("");
  document.getElementById("grid").innerHTML = head + "<tbody>" + rows + "</tbody>";
}

/* ── threads ── */
function renderThreads(){
  const el = document.getElementById("threads");
  const th = PAYLOAD.threads.slice().sort((a,b) =>
    (b.scope_blocking?1:0) - (a.scope_blocking?1:0));
  document.getElementById("t-count").textContent = th.length;
  if(!th.length){ el.innerHTML = '<div class="empty">No open assumptions or questions.</div>'; return; }
  el.innerHTML = th.map(t => `<div class="thread ${t.scope_blocking?"block":""}">
    <span class="tk ${esc(t.kind)}">${esc(t.kind)}</span>
    <span>${esc(t.text)}</span>
    <span class="who">${esc(t.container)} · ${esc(t.artifact)}${
      t.affects ? " · affects " + esc(t.affects) : ""}</span>
    ${t.scope_blocking ? '<span class="flag">BLOCKS HG1</span>' : ""}
  </div>`).join("");
}

/* ── drawer ── */
function openStep(repo, id, stepId){
  const item = PAYLOAD.items.find(i => i.repo === repo && i.id === id);
  if(!item || !item.steps) return;
  const s = item.steps[stepId];
  if(!s) return;
  const ins = (s.inputs || []).map(x => `<span class="chip">${esc(x)}</span>`).join("") ||
    '<span class="sub">—</span>';
  const outs = (s.artifacts || []).map(a =>
    `<span class="chip">${esc(a.file)}<span class="st">${esc(a.status)}${
      a.score != null ? " · " + a.score : ""}</span></span>`).join("") ||
    '<span class="sub">not produced yet</span>';
  const checks = (s.artifacts || []).flatMap(a => (a.checks || []).map(c =>
    `<div class="chk"><span>${esc(c.name)}
       <div class="d">${c.ok}/${c.total}${c.ratio < 1 ? " — " + esc(c.detail) : ""}</div></span>
      <span class="r ${sClass(Math.round(c.ratio*100))}">${Math.round(c.ratio*100)}%</span></div>`
  )).join("");
  const fnd = (item.findings || []).filter(f => f.attributed === stepId).map(f =>
    `<div class="fnd"><span class="sev ${esc(f.severity)}">${esc(f.severity||"?")}</span>
      ${esc(f.text)} <span class="who">${esc(f.gate)} · ${esc(f.resolution)}</span></div>`).join("");
  const human = ["HG0","HG1","HG2"].includes(stepId);
  document.getElementById("drawer-body").innerHTML = `
    <h3>${esc(s.label)} <span class="sub">${esc(stepId)} · ${esc(item.id)}</span></h3>
    <div class="sub">${esc(item.title)}</div>
    <div class="io">
      <div><h4>IN</h4>${ins}</div>
      <div><h4>OUT</h4>${outs}</div>
    </div>
    ${human ? `<div class="note"><b>Human decision.</b> ${
      stepId==="HG0" ? "The bet — never delegable to the agent; the uncertainty <i>is</i> the bet."
      : stepId==="HG1" ? "Approves the scope triple P + R + NG — not the draft AC, whose testability is judged mechanically at G1/G2."
      : "Merge approval. Irreversible and outward-facing; delegable only by a standing per-repo DEC."}</div>` : ""}
    ${checks ? `<h4 style="margin-top:.9rem">Checks (each a ratio)</h4>${checks}` : ""}
    ${fnd ? `<h4 style="margin-top:.9rem">Findings attributed to ${esc(stepId)}</h4>${fnd}` : ""}
    ${s.state === "skipped" ? '<div class="note">Optional step, not run. Absent is not broken — skipped checks are excluded from the score rather than failed.</div>' : ""}
    <div class="note">Scores here are derived from the files at scan time. Whether an AC is
      genuinely <i>testable</i> — and whether a charter slice is genuinely <i>vertical</i> — is not
      mechanically decidable; those are judged by the G1/G2 assessors and reach the score only as
      findings.</div>`;
  document.getElementById("drawer").classList.add("open");
}
function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); }
document.addEventListener("keydown", e => { if(e.key === "Escape") closeDrawer(); });

/* ── boot ── */
function renderAll(){
  const sel = document.getElementById("f-repo");
  const repos = [...new Set(PAYLOAD.items.map(i => i.repo))].sort();
  const cur = sel.value;
  sel.innerHTML = '<option value="">all repos</option>' +
    repos.map(r => `<option ${r===cur?"selected":""}>${esc(r)}</option>`).join("");
  renderKpis(); renderCharters(); renderGrid(); renderThreads();
}
["f-repo","f-status","sort"].forEach(id =>
  document.getElementById(id).addEventListener("change", renderGrid));

if(PAYLOAD) renderAll();
if(LIVE){
  const poll = () => fetch("/api/board").then(r => r.json())
    .then(p => { PAYLOAD = p; renderAll(); }).catch(()=>{});
  poll(); setInterval(poll, 5000);
}
</script>
</body>
</html>
