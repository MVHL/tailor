<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__AG_TITLE__</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2b3444;
    --ink:#e6edf3; --dim:#9aa7b4; --faint:#6b7684;
    --accent:#4c8dff; --good:#2ea043; --amber:#d29922; --red:#e5534b;
    --violet:#a371f7; --blue:#4c8dff;
    --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#f6f8fa; --panel:#fff; --panel2:#f0f3f7; --line:#d8dee4;
           --ink:#1f2328; --dim:#57606a; --faint:#8c959f; }
  }
  :root[data-theme="dark"]{ --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2b3444;
    --ink:#e6edf3; --dim:#9aa7b4; --faint:#6b7684; }
  :root[data-theme="light"]{ --bg:#f6f8fa; --panel:#fff; --panel2:#f0f3f7; --line:#d8dee4;
    --ink:#1f2328; --dim:#57606a; --faint:#8c959f; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 80px}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12.5px}
  .sub code{font-family:var(--mono);font-size:11.5px}
  .hgroup{display:flex;align-items:center;gap:12px}
  .toggle{background:var(--panel);border:1px solid var(--line);color:var(--dim);
          border-radius:20px;padding:6px 12px;cursor:pointer;font-size:12px}
  .toggle:hover{color:var(--ink)}

  /* slim summary strip */
  .kpis{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px;padding:12px 16px;
        background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
  .kpi .n{font-size:20px;font-weight:650;letter-spacing:-.02em}
  .kpi .l{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
  .kpi.alert .n{color:var(--red)}

  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  select,input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:var(--sans)}
  label.chk{font-size:12px;color:var(--dim);display:inline-flex;gap:6px;align-items:center;cursor:pointer}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
        border-radius:var(--radius);overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  th{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
     cursor:pointer;user-select:none}
  th:hover{color:var(--ink)}
  tbody tr.task{cursor:pointer}
  tbody tr.task:hover{background:var(--panel2)}
  tbody tr.child td{background:var(--panel2);border-bottom:1px solid var(--line)}
  td.name{font-weight:600}
  td.name.child{font-weight:400}
  .caret{display:inline-block;width:12px;color:var(--faint);transition:transform .12s;font-size:11px}
  .caret.open{transform:rotate(90deg)}
  .caret.leaf{opacity:0}
  .repo{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:8px;
        background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .who{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .model{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
  td.result{color:var(--dim);max-width:440px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.result.wrap{white-space:normal}
  .upd{color:var(--faint);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
  .score{font-family:var(--mono);font-weight:650}
  .sc-good{color:var(--good)} .sc-mid{color:var(--amber)} .sc-bad{color:var(--red)}
  .muted{color:var(--faint)}

  /* status dot (task + sub-task) */
  .sdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--faint);vertical-align:middle}
  .sdot.done{background:var(--good)} .sdot.failed{background:var(--red)}
  .sdot.review{background:var(--amber)} .sdot.pending{background:var(--faint)}
  .sdot.running{background:var(--blue);box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 60%,transparent);
                animation:pulse 1.7s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 55%,transparent)}
                   70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .warn{margin-left:7px;cursor:help;color:var(--amber)}
  .warn.red{color:var(--red)}
  td.c-caret,td.c-stat{width:1%;white-space:nowrap;padding-right:0}

  /* task detail (record) */
  tr.detail td{background:var(--panel2);padding:0}
  .drill{padding:14px 18px 16px 40px;display:grid;grid-template-columns:230px 1fr;gap:22px;border-top:1px dashed var(--line)}
  @media(max-width:720px){.drill{grid-template-columns:1fr}}
  .drill h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  .barrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12px}
  .barrow .lab{width:64px;color:var(--dim);flex:none}
  .track{flex:1;height:7px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .fill{height:100%}
  .barrow .val{width:30px;text-align:right;font-family:var(--mono);color:var(--dim);flex:none}
  .closelist{margin:0 0 10px}
  .closelist .h{font-size:12px;font-weight:600;margin:0 0 2px}
  .closelist ul{margin:0 0 4px;padding-left:18px}
  .closelist li{font-size:12.5px;margin:2px 0}
  .closelist.bugs .h,.closelist.bugs li{color:var(--red)}
  .none{color:var(--faint);font-size:12px}
  .path{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:8px;word-break:break-all}
  .empty{color:var(--faint);font-size:13px;padding:20px;text-align:center}

  footer{margin-top:26px;color:var(--faint);font-size:11.5px;text-align:center}
  .live{display:none;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
  .live.on{display:inline-flex}
  .ldot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse2 1.8s infinite}
  .live.stale .ldot{background:var(--amber);animation:none} .live.err .ldot{background:var(--red);animation:none}
  @keyframes pulse2{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">__AG_TITLE__</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="hgroup">
      <span class="live" id="live"><span class="ldot"></span><span id="liveTxt">live</span></span>
      <button class="toggle" id="pauseBtn" style="display:none">⏸ pause</button>
      <button class="toggle" id="themeBtn">◐ theme</button>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="filter sessions…">
    <select id="fStatus"><option value="">all statuses</option></select>
    <select id="fRepo"><option value="">all repos</option></select>
    <label class="chk"><input type="checkbox" id="fAttn"> needs attention only</label>
  </div>

  <table id="tbl">
    <thead><tr>
      <th class="c-caret"></th><th class="c-stat"></th>
      <th data-k="title">Session · sub-session</th>
      <th data-k="model">Model</th>
      <th data-k="result">Result</th>
      <th data-k="score">Score</th>
      <th data-k="updated">Updated</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <footer id="foot"></footer>
</div>

<script>
let PAYLOAD = /*__AG_DATA__*/null;
const LIVE = /*__AG_LIVE__*/false;
const POLL_MS = 5000;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => (typeof v==="number"&&!isNaN(v))?v:null;
const SEV = {blocked:0,"awaiting-decision":1,"in-review":2,"in-progress":3,framed:3,planned:3,done:4};

let data=[], sortK="status", sortDir=1, lastHash="";
const openKeys = new Set();
const key = r => r.task+"@"+r.repo;

function fmtElapsed(a,b){
  if(!a) return "—";
  const s=Date.parse(a); if(isNaN(s)) return "—";
  const e=b?Date.parse(b):Date.now();
  let d=Math.max(0,Math.round((e-s)/1000));
  if(d<60) return d+"s";
  const m=Math.floor(d/60), sec=d%60;
  if(m<60) return m+"m"+(sec?" "+sec+"s":"");
  const h=Math.floor(m/60); return h+"h"+(m%60?" "+(m%60)+"m":"");
}
function fmtTok(t){ t=num(t); if(t==null)return null; return t>=1000?(t/1000).toFixed(t>=10000?0:1)+"k":String(t); }
function scoreClass(s){ return s==null?"muted":(s>=80?"sc-good":s>=50?"sc-mid":"sc-bad"); }

/* status → dot class, shared by tasks and sub-sessions */
function taskStatusKey(r){
  if(r.live) return "running";
  const s=r.status;
  if(s==="done") return "done";
  if(s==="blocked"||s==="failed") return "failed";
  if(s==="in-review"||s==="awaiting-decision") return "review";
  return "pending";
}
function childStatusKey(c){
  if(c.live) return "running";
  if(c.status==="done") return "done";
  if(c.status==="failed"||c.status==="timeout") return "failed";
  return "pending";
}
const dot = k => `<span class="sdot ${k}" title="${k}"></span>`;
function warnIcon(r){
  if(!r.needsAttention) return "";
  const red = ["blocked","failed"].includes(r.status);
  return `<span class="warn${red?' red':''}" title="${esc(r.attention||'needs attention')}">⚠</span>`;
}

function deriveData(payload){
  return ((payload&&payload.runs)||[]).map(r=>{
    r.metrics = r.metrics||{};
    r.score = num(r.metrics.overall_score);
    r.children = r.children||[];
    return r;
  });
}

function renderHeader(){
  $("#sub").innerHTML = `${data.filter(r=>!r.synthetic).length} session(s) · `
    + `${(PAYLOAD.repos||[]).length} repo(s) · `
    + (PAYLOAD.repos||[]).map(p=>`<code>${esc(p.split("/").pop())}</code>`).join(" ");
}

function renderKpis(){
  const tasks=data.filter(r=>!r.synthetic);
  const closed=tasks.filter(r=>r.status==="done");
  const running=data.filter(r=>r.live).length;
  const attn=data.filter(r=>r.needsAttention).length;
  const scores=closed.map(r=>r.score).filter(s=>s!=null);
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;
  const kpi=(n,l,alert)=>`<div class="kpi${alert?' alert':''}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  $("#kpis").innerHTML =
      kpi(tasks.length,"Sessions")
    + kpi(running,"Running now",running>0)
    + kpi(attn,"Needs attention",attn>0)
    + kpi(avg==null?"—":avg,"Avg score");
}

function rebuildFilters(){
  [["#fStatus",[...new Set(data.map(r=>r.status))].filter(Boolean),"all statuses"],
   ["#fRepo",[...new Set(data.map(r=>r.repo))],"all repos"]].forEach(([sel,vals,allLbl])=>{
    const s=$(sel), cur=s.value;
    s.innerHTML=`<option value="">${allLbl}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
    if(vals.includes(cur)) s.value=cur;
  });
}

function rowsFiltered(){
  const q=$("#q").value.toLowerCase(), fs=$("#fStatus").value, fr=$("#fRepo").value, fa=$("#fAttn").checked;
  let rows=data.filter(r=>{
    const hay=(r.task+" "+r.title+" "+r.children.map(c=>c.who+" "+c.label).join(" ")).toLowerCase();
    return (!q||hay.includes(q)) && (!fs||r.status===fs) && (!fr||r.repo===fr) && (!fa||r.needsAttention);
  });
  const val=r=>{
    if(sortK==="status") return SEV[r.status]??9;
    if(sortK==="score")  return r.score==null?-1:r.score;
    if(sortK==="updated")return Date.parse(r.closed||"")||0;
    return (r[sortK]==null?"":String(r[sortK])).toLowerCase();
  };
  rows.sort((a,b)=>{ const x=val(a),y=val(b); return (x>y?1:x<y?-1:0)*sortDir; });
  return rows;
}

function taskResultText(r){
  if(r.whatShipped) return r.whatShipped;
  if(r.attention)   return r.attention;
  return r.stage||r.status||"";
}
function childResultText(c){
  if(c.kind==="agy") return c.result || c.status;
  return c.label || c.status;   // sub-agent: its purpose
}

function taskRow(r){
  const k=key(r), open=openKeys.has(k);
  const hasKids=r.children.length>0, hasDetail=!r.synthetic;
  const caret = (hasKids||hasDetail)
    ? `<span class="caret ${open?'open':''}">▶</span>` : `<span class="caret leaf">▶</span>`;
  const model = r.model ? `<span class="model">${esc(r.model)}</span>` : `<span class="muted">—</span>`;
  const kids = r.children.length?` <span class="muted" style="font-weight:400">· ${r.children.length} sub</span>`:"";
  return `<tr class="task" data-k="${esc(k)}">
    <td class="c-caret">${caret}</td>
    <td class="c-stat">${dot(taskStatusKey(r))}</td>
    <td class="name">${esc(r.title||r.task)}<span class="repo">${esc(r.repo)}</span>${warnIcon(r)}${kids}</td>
    <td>${model}</td>
    <td class="result" title="${esc(taskResultText(r))}">${esc(taskResultText(r))}</td>
    <td class="score ${scoreClass(r.score)}">${r.score==null?"—":r.score}</td>
    <td class="upd">${esc(r.closed||(r.live?"live":"—"))}</td>
  </tr>`;
}
function childRow(c){
  const tok=fmtTok(c.tokens);
  const upd=fmtElapsed(c.started,c.finished)+(tok?` · ${tok} tok`:"");
  const model = c.model ? `<span class="model">${esc(c.model)}</span>` : `<span class="muted">—</span>`;
  return `<tr class="child">
    <td class="c-caret"></td>
    <td class="c-stat">${dot(childStatusKey(c))}</td>
    <td class="name child"><span class="who">↳ ${esc(c.who)}</span></td>
    <td>${model}</td>
    <td class="result wrap" title="${esc(childResultText(c))}">${esc(childResultText(c))}</td>
    <td class="muted">—</td>
    <td class="upd">${esc(upd)}</td>
  </tr>`;
}
function metricBar(lab,v){
  v=num(v);
  const c=v==null?"var(--faint)":(v>=80?"var(--good)":v>=50?"var(--amber)":"var(--red)");
  return `<div class="barrow"><span class="lab">${lab}</span>
    <span class="track"><span class="fill" style="width:${v||0}%;background:${c}"></span></span>
    <span class="val">${v==null?"—":v}</span></div>`;
}
function closeList(cls,title,items){
  if(!items||!items.length) return "";
  return `<div class="closelist ${cls}"><div class="h">${title}</div><ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`;
}
function detailRow(r){
  const m=r.metrics||{}, d=m.delegate||{}, cl=r.closing||{};
  const anyClosing = cl.assumptions?.length||cl.problems?.length||cl.bugs?.length||cl.issues?.length;
  const scores = (m.overall_score!=null||m.frame||m.plan||m.delegate||m.review)
    ? `<h4>Scores</h4>${metricBar("frame",(m.frame||{}).score)}${metricBar("plan",(m.plan||{}).score)}
       ${metricBar("delegate",(m.delegate||{}).score)}${metricBar("review",(m.review||{}).score)}
       ${metricBar("overall",r.score)}` : `<h4>Scores</h4><div class="none">Not reviewed yet.</div>`;
  const html=`<div class="drill">
    <div>${scores}
      <h4 style="margin-top:12px">Run</h4>
      <div class="none" style="font-family:var(--mono);color:var(--dim);line-height:1.8">
        impl: ${esc(r.implementer||(r.model?"agy":"—"))}<br>
        iters: ${d.iterations ?? (r.children.filter(c=>c.kind==="agy").length || "—")} ·
        tests: ${esc(r.tests||"—")}<br>branch: ${esc(r.branch||"—")}</div>
    </div>
    <div>
      ${r.whatShipped?`<h4>What shipped</h4><div style="margin-bottom:10px;color:var(--ink)">${esc(r.whatShipped)}</div>`:""}
      <h4>Closing record</h4>
      ${anyClosing?
        closeList("","Assumptions",cl.assumptions)+closeList("","Discovered problems",cl.problems)
        +closeList("bugs","Possible bugs",cl.bugs)+closeList("","Open issues",cl.issues)
        :`<div class="none">No closing record yet.</div>`}
      <div class="path">${esc(r.recordPath||r.runPath||"")}</div>
    </div>
  </div>`;
  return `<tr class="detail"><td colspan="7">${html}</td></tr>`;
}

function render(){
  const rows=rowsFiltered();
  const tb=$("#tbody");
  if(!rows.length){ tb.innerHTML=`<tr><td colspan="7" class="empty">No sessions match.</td></tr>`;
                    $("#foot").textContent=`0 of ${data.length}`; return; }
  let html="";
  rows.forEach(r=>{
    html+=taskRow(r);
    if(openKeys.has(key(r))){
      r.children.forEach(c=>{ html+=childRow(c); });
      if(!r.synthetic) html+=detailRow(r);
    }
  });
  tb.innerHTML=html;
  tb.querySelectorAll("tr.task").forEach(tr=>{
    tr.onclick=()=>{ const k=tr.dataset.k; openKeys.has(k)?openKeys.delete(k):openKeys.add(k); render(); };
  });
  $("#foot").textContent = `${rows.length} of ${data.filter(r=>!r.synthetic).length} session(s)`;
}

function apply(payload,preserve){
  const h=JSON.stringify((payload&&payload.runs)||[]);
  if(preserve && h===lastHash) return false;
  lastHash=h;
  const y=preserve?window.scrollY:0;
  PAYLOAD=payload; data=deriveData(payload);
  renderHeader(); renderKpis(); rebuildFilters(); render();
  if(preserve) window.scrollTo(0,y);
  return true;
}

function bindOnce(){
  $("#themeBtn").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const next=cur==="light"?"dark":(cur==="dark"?"":"light");
    if(next)document.documentElement.setAttribute("data-theme",next);
    else document.documentElement.removeAttribute("data-theme");
  };
  document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(sortK===k)sortDir*=-1; else{sortK=k;sortDir=1;} render();
  });
  ["#q","#fStatus","#fRepo"].forEach(s=>$(s).oninput=render);
  $("#fAttn").onchange=render;
}
bindOnce();

if(LIVE){
  const box=$("#live"), txt=$("#liveTxt"), pause=$("#pauseBtn");
  box.classList.add("on"); pause.style.display="";
  let timer=null, paused=false;
  const setState=(cls,t)=>{ box.classList.remove("stale","err"); if(cls)box.classList.add(cls); txt.textContent=t; };
  async function tick(){
    try{
      const res=await fetch("api/runs",{cache:"no-store"});
      if(!res.ok) throw new Error("http "+res.status);
      apply(await res.json(), true);
      setState("", "live · "+new Date().toTimeString().slice(0,8));
    }catch(e){ setState("err","disconnected — retrying"); }
  }
  pause.onclick=()=>{
    paused=!paused;
    if(paused){ clearInterval(timer); timer=null; pause.textContent="▶ resume"; setState("stale","paused"); }
    else{ pause.textContent="⏸ pause"; tick(); timer=setInterval(tick,POLL_MS); }
  };
  tick(); timer=setInterval(tick,POLL_MS);
}else{
  apply(PAYLOAD,false);
}
</script>
</body>
</html>
