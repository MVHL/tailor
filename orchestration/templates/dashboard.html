<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__AG_TITLE__</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2b3444;
    --ink:#e6edf3; --dim:#9aa7b4; --faint:#6b7684;
    --accent:#4c8dff; --good:#2ea043; --amber:#d29922; --red:#e5534b;
    --violet:#a371f7; --blue:#4c8dff;
    --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#f6f8fa; --panel:#fff; --panel2:#eef1f5; --line:#d8dee4;
           --ink:#1f2328; --dim:#57606a; --faint:#8c959f; }
  }
  :root[data-theme="dark"]{ --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2b3444;
    --ink:#e6edf3; --dim:#9aa7b4; --faint:#6b7684; }
  :root[data-theme="light"]{ --bg:#f6f8fa; --panel:#fff; --panel2:#eef1f5; --line:#d8dee4;
    --ink:#1f2328; --dim:#57606a; --faint:#8c959f; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1500px;margin:0 auto;padding:22px 20px 60px}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:20px;margin:0 0 3px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12.5px}
  .sub code{font-family:var(--mono);font-size:11.5px}
  .hgroup{display:flex;align-items:center;gap:12px}
  .toggle{background:var(--panel);border:1px solid var(--line);color:var(--dim);
          border-radius:20px;padding:6px 12px;cursor:pointer;font-size:12px}
  .toggle:hover{color:var(--ink)}

  .kpis{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px;padding:10px 16px;
        background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
  .kpi .n{font-size:19px;font-weight:650;letter-spacing:-.02em}
  .kpi .l{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
  .kpi.alert .n{color:var(--red)}

  /* three-panel board */
  .board{display:grid;grid-template-columns:300px minmax(0,1fr) 380px;gap:14px;align-items:start}
  @media(max-width:1120px){ .board{grid-template-columns:1fr} #mid{order:-1} }
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .side{position:sticky;top:16px;max-height:calc(100vh - 34px);display:flex;flex-direction:column}
  @media(max-width:1120px){ .side{position:static;max-height:none} }
  .phead{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;
         justify-content:space-between;gap:8px}
  .phead .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600}
  .phead .cx{font-family:var(--mono);font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pbody{padding:13px 15px;overflow:auto}
  .side .pbody{flex:1}

  /* middle: controls + tree */
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}
  select,input[type=search]{background:var(--bg);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:var(--sans)}
  input[type=search]{flex:1;min-width:120px}
  label.chk{font-size:12px;color:var(--dim);display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
  #tree{padding:8px 8px 12px;max-height:calc(100vh - 210px);overflow:auto}
  @media(max-width:1120px){ #tree{max-height:none} }

  .row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;
       border:1px solid transparent}
  .row:hover{background:var(--panel2)}
  .row.sel{background:color-mix(in srgb,var(--accent) 15%,transparent);
           border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .row.child{margin-left:22px}
  .caret{display:inline-block;width:12px;flex:none;color:var(--faint);font-size:10px;
         transition:transform .12s;text-align:center}
  .caret.open{transform:rotate(90deg)} .caret.leaf{opacity:0;cursor:default}
  .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .row.child .nm{font-weight:400}
  .who{font-family:var(--mono);color:var(--dim)}
  .mtag{font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--panel2);
        border:1px solid var(--line);border-radius:5px;padding:0 5px;flex:none}
  .repo{font-family:var(--mono);font-size:10px;color:var(--faint);flex:none}
  .rmeta{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none}
  .scoreb{font-family:var(--mono);font-weight:650;font-size:12px;flex:none}
  .sc-good{color:var(--good)} .sc-mid{color:var(--amber)} .sc-bad{color:var(--red)}
  .muted{color:var(--faint)}

  .sdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
  .sdot.done{background:var(--good)} .sdot.failed{background:var(--red)}
  .sdot.review{background:var(--amber)} .sdot.pending{background:var(--faint)}
  .sdot.running{background:var(--blue);box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 60%,transparent);
                animation:pulse 1.7s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 55%,transparent)}
                   70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .warn{cursor:help;color:var(--amber);flex:none}
  .warn.red{color:var(--red)}

  /* side panel content */
  .stat-line{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono);
        background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .kv{font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.9;word-break:break-word}
  .h4{margin:14px 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
  .h4:first-child{margin-top:0}
  .doc{font-size:12.5px;line-height:1.55}
  .doc .dh{font-weight:700;color:var(--ink);margin:11px 0 3px}
  .doc .dp{color:var(--dim);margin:1px 0}
  .doc .dli{color:var(--ink);margin:1px 0 1px 8px}
  .doc .dsp{height:7px}
  pre.out{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11.5px;
          color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;
          padding:10px 11px;margin:0;max-height:340px;overflow:auto}
  .barrow{display:flex;align-items:center;gap:9px;margin:5px 0;font-size:12px}
  .barrow .lab{width:60px;color:var(--dim);flex:none}
  .track{flex:1;height:7px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .fill{height:100%}
  .barrow .val{width:28px;text-align:right;font-family:var(--mono);color:var(--dim);flex:none}
  /* framing items (P/R/NG/AC/T/IM) — linked chips, click to trace the chain */
  .grp{margin-bottom:13px}
  .grp-h{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;
         letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px}
  .grp-n{color:var(--faint);font-weight:600;letter-spacing:0}
  .item{display:flex;gap:7px;padding:5px 6px;border-radius:7px;cursor:pointer;
        border-left:2px solid transparent;transition:opacity .15s,background .12s}
  .item:hover{background:var(--panel2)}
  .item.lit{background:var(--panel2)}
  .item.dim{opacity:.18}
  .item .tx{flex:1;min-width:0;font-size:12.5px;line-height:1.45;overflow-wrap:break-word}
  .ip{flex:none;font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;height:17px;line-height:15px}
  .ip-P{background:#FEE2E2;color:#DC2626}  .ip-R{background:#DBEAFE;color:#1D4ED8}
  .ip-AC{background:#DCFCE7;color:#059669} .ip-T{background:#EDE9FE;color:#7C3AED}
  .ip-IM{background:#FEF3C7;color:#D97706} .ip-NG{background:#F3F4F6;color:#6B7280}
  .ip-SIG,.ip-ASK{background:#E2E8F0;color:#475569}
  .refs{display:inline-flex;flex-wrap:wrap;gap:3px;margin-top:3px;align-items:center}
  .rl{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
  .rt{font-size:9.5px;font-weight:700;padding:0 4px;border-radius:4px;background:var(--panel2);
      border:1px solid var(--line);color:var(--dim)}
  .ck{display:flex;align-items:center;gap:7px;font-size:11.5px;margin:3px 0;color:var(--dim)}
  .ck .m{flex:none;width:12px;text-align:center;font-weight:800}
  .ck.ok .m{color:var(--good)} .ck.gap .m{color:var(--red)}
  .ck .cn{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto;flex:none}
  .bigscore{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
  .bigscore .v{font-size:26px;font-weight:750;letter-spacing:-.02em}
  .bigscore .c{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .dimrow{margin:7px 0}
  .dimtop{display:flex;align-items:baseline;gap:8px;font-size:12px}
  .dimtop .dl{font-weight:600} .dimtop .dv{margin-left:auto;font-family:var(--mono);font-weight:650}
  .dimtop .dw{font-size:9.5px;color:var(--faint);font-family:var(--mono)}
  .dimwhy{font-size:11px;color:var(--faint);margin-top:1px}
  .capwarn{background:color-mix(in srgb,var(--red) 12%,transparent);border:1px solid color-mix(in srgb,var(--red) 35%,transparent);
           color:var(--red);border-radius:7px;padding:6px 9px;font-size:11.5px;margin-bottom:9px}
  .clist{margin:0 0 9px} .clist .h{font-size:12px;font-weight:600;margin:0 0 2px}
  .clist ul{margin:0;padding-left:17px} .clist li{font-size:12.5px;margin:2px 0}
  .clist.bugs .h,.clist.bugs li{color:var(--red)}
  .none{color:var(--faint);font-size:12px}
  .path{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:10px;word-break:break-all}
  .hint{color:var(--faint);font-size:12.5px;padding:8px 2px}

  footer{margin-top:20px;color:var(--faint);font-size:11.5px;text-align:center}
  .live{display:none;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
  .live.on{display:inline-flex}
  .ldot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse2 1.8s infinite}
  .live.stale .ldot{background:var(--amber);animation:none} .live.err .ldot{background:var(--red);animation:none}
  @keyframes pulse2{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">__AG_TITLE__</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="hgroup">
      <span class="live" id="live"><span class="ldot"></span><span id="liveTxt">live</span></span>
      <button class="toggle" id="pauseBtn" style="display:none">⏸ pause</button>
      <button class="toggle" id="themeBtn">◐ theme</button>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="board">
    <!-- LEFT: input / framing -->
    <aside class="panel side" id="leftPanel">
      <div class="phead"><span class="h">Input · Framing</span><span class="cx" id="leftCx"></span></div>
      <div class="pbody" id="leftBody"></div>
    </aside>

    <!-- MIDDLE: process (tasks · sub-tasks · status) -->
    <main class="panel" id="mid">
      <div class="controls">
        <input type="search" id="q" placeholder="filter…">
        <select id="fStatus"><option value="">all statuses</option></select>
        <select id="fRepo"><option value="">all repos</option></select>
        <label class="chk"><input type="checkbox" id="fAttn"> ⚠ only</label>
      </div>
      <div id="tree"></div>
    </main>

    <!-- RIGHT: output -->
    <aside class="panel side" id="rightPanel">
      <div class="phead"><span class="h">Output</span><span class="cx" id="rightCx"></span></div>
      <div class="pbody" id="rightBody"></div>
    </aside>
  </div>

  <footer id="foot"></footer>
</div>

<script>
let PAYLOAD = /*__AG_DATA__*/null;
const LIVE = /*__AG_LIVE__*/false;
const POLL_MS = 5000;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => (typeof v==="number"&&!isNaN(v))?v:null;
const SEV = {blocked:0,"awaiting-decision":1,"in-review":2,"in-progress":3,framed:3,planned:3,done:4};

let data=[], sortK="status", sortDir=1, lastHash="";
const expanded = new Set();
let sel = null;                       // {taskKey, childIdx|null}
const keyOf = r => r.task+"@"+r.repo;

function fmtElapsed(a,b){
  if(!a) return "—";
  const s=Date.parse(a); if(isNaN(s)) return "—";
  const e=b?Date.parse(b):Date.now();
  let d=Math.max(0,Math.round((e-s)/1000));
  if(d<60) return d+"s";
  const m=Math.floor(d/60), sec=d%60;
  if(m<60) return m+"m"+(sec?" "+sec+"s":"");
  const h=Math.floor(m/60); return h+"h"+(m%60?" "+(m%60)+"m":"");
}
function fmtTok(t){ t=num(t); if(t==null)return null; return t>=1000?(t/1000).toFixed(t>=10000?0:1)+"k":String(t); }
function scoreCls(s){ if(s==null)return "muted"; if(s>=80)return "sc-good"; if(s>=50)return "sc-mid"; return "sc-bad"; }

function taskStatusKey(r){
  if(r.live) return "running";
  const s=r.status;
  if(s==="done") return "done";
  if(s==="blocked"||s==="failed") return "failed";
  if(s==="in-review"||s==="awaiting-decision") return "review";
  return "pending";
}
function childStatusKey(c){
  if(c.live) return "running";
  if(c.status==="done") return "done";
  if(c.status==="failed"||c.status==="timeout") return "failed";
  return "pending";
}
const dot = k => '<span class="sdot '+k+'" title="'+k+'"></span>';

function deriveData(payload){
  return ((payload&&payload.runs)||[]).map(r=>{
    r.metrics = r.metrics||{};
    // output quality (content-based) is the headline score; fall back to the recorded one
    r.score = r.quality ? r.quality.overall : num(r.metrics.overall_score);
    r.children = r.children||[];
    return r;
  });
}
const findTask = k => data.find(r=>keyOf(r)===k) || null;

/* ---------- header + KPIs ---------- */
function renderHeader(){
  $("#sub").innerHTML = data.filter(r=>!r.synthetic).length+" session(s) · "
    + ((PAYLOAD.repos||[]).length)+" repo(s) · "
    + (PAYLOAD.repos||[]).map(p=>'<code>'+esc(p.split("/").pop())+'</code>').join(" ");
}
function renderKpis(){
  const tasks=data.filter(r=>!r.synthetic);
  const closed=tasks.filter(r=>r.status==="done");
  const running=data.filter(r=>r.live).length;
  const attn=data.filter(r=>r.needsAttention).length;
  const scores=closed.map(r=>r.score).filter(s=>s!=null);
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;
  const kpi=(n,l,alert)=>'<div class="kpi'+(alert?' alert':'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';
  $("#kpis").innerHTML = kpi(tasks.length,"Sessions")
    + kpi(running,"Running now",running>0)
    + kpi(attn,"Needs attention",attn>0)
    + kpi(avg==null?"—":avg,"Avg score");
}

/* ---------- filters ---------- */
function rebuildFilters(){
  [["#fStatus",[...new Set(data.map(r=>r.status))].filter(Boolean),"all statuses"],
   ["#fRepo",[...new Set(data.map(r=>r.repo))],"all repos"]].forEach(([s,vals,all])=>{
    const el=$(s), cur=el.value;
    el.innerHTML='<option value="">'+all+'</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join("");
    if(vals.includes(cur)) el.value=cur;
  });
}
function rowsFiltered(){
  const q=$("#q").value.toLowerCase(), fs=$("#fStatus").value, fr=$("#fRepo").value, fa=$("#fAttn").checked;
  let rows=data.filter(r=>{
    const hay=(r.task+" "+r.title+" "+r.children.map(c=>c.who+" "+c.label).join(" ")).toLowerCase();
    return (!q||hay.includes(q)) && (!fs||r.status===fs) && (!fr||r.repo===fr) && (!fa||r.needsAttention);
  });
  const val=r=>{
    if(sortK==="status") return SEV[r.status]==null?9:SEV[r.status];
    if(sortK==="score")  return r.score==null?-1:r.score;
    return String(r.title||r.task).toLowerCase();
  };
  rows.sort((a,b)=>{ const x=val(a),y=val(b); return (x>y?1:x<y?-1:0)*sortDir; });
  return rows;
}

/* ---------- middle: the process tree (clean) ---------- */
function taskRowHtml(r){
  const k=keyOf(r), open=expanded.has(k);
  const hasKids=r.children.length>0;
  const caret='<span class="caret '+(hasKids?(open?'open':''):'leaf')+'">▶</span>';
  const model=r.model?'<span class="mtag">'+esc(r.model)+'</span>':'';
  const warn=r.needsAttention?'<span class="warn'+(["blocked","failed"].includes(r.status)?' red':'')+'" title="'+esc(r.attention||'needs attention')+'">⚠</span>':'';
  // framing score (input health) stays muted; output score is the headline
  const fr=r.framingScore!=null?'<span class="rmeta" title="framing score">f'+r.framingScore+'</span>':'';
  const right=fr+(r.score!=null
      ? '<span class="scoreb '+scoreCls(r.score)+'">'+r.score+'</span>'
      : (r.live?'<span class="rmeta">live</span>':'<span class="rmeta">'+esc(r.stage||r.status||"")+'</span>'));
  const cls='row task'+(sel&&sel.taskKey===k&&sel.childIdx==null?' sel':'');
  return '<div class="'+cls+'" data-k="'+esc(k)+'">'+caret+dot(taskStatusKey(r))
    +'<span class="nm">'+esc(r.title||r.task)+'</span>'
    +'<span class="repo">'+esc(r.repo)+'</span>'+model+warn+right+'</div>';
}
function childRowHtml(r,c,i){
  const k=keyOf(r);
  const model=c.model?'<span class="mtag">'+esc(c.model)+'</span>':'';
  const meta=c.live?'<span class="rmeta">'+fmtElapsed(c.started)+'</span>'
                   :'<span class="rmeta">'+esc(c.status||"")+'</span>';
  const cls='row child'+(sel&&sel.taskKey===k&&sel.childIdx===i?' sel':'');
  return '<div class="'+cls+'" data-k="'+esc(k)+'" data-ci="'+i+'">'
    +'<span class="caret leaf">▶</span>'+dot(childStatusKey(c))
    +'<span class="nm"><span class="who">↳ '+esc(c.who)+'</span></span>'+model+meta+'</div>';
}
function renderTree(){
  const rows=rowsFiltered();
  const box=$("#tree");
  if(!rows.length){ box.innerHTML='<div class="hint">No sessions match.</div>';
                    $("#foot").textContent="0 shown"; return; }
  let h="";
  rows.forEach(r=>{
    h+=taskRowHtml(r);
    if(expanded.has(keyOf(r))) r.children.forEach((c,i)=>{ h+=childRowHtml(r,c,i); });
  });
  box.innerHTML=h;
  $("#foot").textContent = rows.length+" of "+data.filter(x=>!x.synthetic).length+" session(s)";
}

/* ---------- left panel: framing as a linked item graph (input) ---------- */
const GROUPS=[["P","Problems","why"],["R","Requirements","what"],["NG","Non-Goals","won't do"],
              ["AC","Acceptance Criteria","done means"],["T","Test Plan","proves"],
              ["IM","Impl Plan","how"]];
const REFLABEL={P:"evidence",R:"solves",AC:"covers",T:"covers",IM:"implements",NG:"deferred"};
let traceId=null;   // currently traced item id

function itemHtml(it){
  const refs=(it.refs||[]).concat(it.tags||[]);
  const rl=refs.length?'<div class="refs"><span class="rl">'+(REFLABEL[it.kind]||"refs")+'</span>'
      +refs.map(x=>'<span class="rt">'+esc(x)+'</span>').join("")+'</div>':"";
  return '<div class="item" data-id="'+esc(it.id)+'"><span class="ip ip-'+esc(it.kind)+'">'
    +esc(it.id)+'</span><div class="tx">'+esc(it.text||"")+rl+'</div></div>';
}
function framingHtml(a){
  const f=a.framing; if(!f) return "";
  let h='<div class="bigscore"><span class="v '+scoreCls(f.score)+'">'+f.score+'</span>'
       +'<span class="c">framing score</span></div>';
  h+=f.checks.map(function(c){
    const ok=c.ratio===1;
    return '<div class="ck '+(ok?'ok':'gap')+'"><span class="m">'+(ok?'✓':'!')+'</span>'
      +'<span>'+esc(c.name)+(ok?'':' — '+esc(c.detail))+'</span>'
      +'<span class="cn">'+c.ok+'/'+c.total+'</span></div>';
  }).join("");
  return h;
}
function renderLeft(){
  const r = sel ? findTask(sel.taskKey) : null;
  const cx=$("#leftCx"), body=$("#leftBody");
  if(!r){ cx.textContent=""; body.innerHTML='<div class="hint">Select a session to see its framing.</div>'; return; }
  cx.textContent = r.repo+" · "+r.task;
  const a=r.artifacts;
  if(!a||!a.items.length){
    body.innerHTML='<div class="none">No framing artifacts parsed — this task has no tagged '
      +'spec.md / TP.md / IP.md items yet.</div>'; return; }
  let h=framingHtml(a);
  GROUPS.forEach(function(g){
    const list=a.items.filter(i=>i.kind===g[0]);
    if(!list.length) return;
    h+='<div class="grp"><div class="grp-h"><span class="ip ip-'+g[0]+'">'+g[0]+'</span>'
      +'<span>'+g[1]+'</span><span class="grp-n">'+list.length+' · '+g[2]+'</span></div>'
      +list.map(itemHtml).join("")+'</div>';
  });
  h+='<div class="none" style="margin-top:4px">Click an item to trace its chain; click again to clear.</div>';
  body.innerHTML=h;
  applyTrace();
}
function applyTrace(){
  const r=sel?findTask(sel.taskKey):null;
  const rel=(r&&r.artifacts&&r.artifacts.rel)||{};
  const nodes=$("#leftBody").querySelectorAll(".item");
  nodes.forEach(function(n){
    n.classList.remove("lit","dim");
    if(!traceId) return;
    const id=n.getAttribute("data-id");
    if(id===traceId||(rel[traceId]||[]).indexOf(id)>=0) n.classList.add("lit");
    else n.classList.add("dim");
  });
}

/* ---------- right panel: output ---------- */
function bar(lab,v){
  v=num(v);
  const c=v==null?"var(--faint)":(v>=80?"var(--good)":v>=50?"var(--amber)":"var(--red)");
  return '<div class="barrow"><span class="lab">'+lab+'</span><span class="track">'
    +'<span class="fill" style="width:'+(v||0)+'%;background:'+c+'"></span></span>'
    +'<span class="val">'+(v==null?"—":v)+'</span></div>';
}
function clist(cls,title,items){
  if(!items||!items.length) return "";
  return '<div class="clist '+cls+'"><div class="h">'+title+'</div><ul>'
    +items.map(i=>'<li>'+esc(i)+'</li>').join("")+'</ul></div>';
}
function dimRow(d){
  const c=d.score>=80?"var(--good)":d.score>=50?"var(--amber)":"var(--red)";
  return '<div class="dimrow"><div class="dimtop"><span class="dl">'+esc(d.label)+'</span>'
    +'<span class="dw">×'+d.weight+'</span>'
    +'<span class="dv '+scoreCls(d.score)+'">'+d.score+'</span></div>'
    +'<div class="track" style="margin-top:3px"><span class="fill" style="width:'+d.score+'%;background:'+c+'"></span></div>'
    +'<div class="dimwhy">'+esc(d.why||"")+'</div></div>';
}
function taskOutputHtml(r){
  const cl=r.closing||{}, q=r.quality;
  const anyClosing = (cl.assumptions&&cl.assumptions.length)||(cl.problems&&cl.problems.length)
                   ||(cl.bugs&&cl.bugs.length)||(cl.issues&&cl.issues.length);
  let h='<div class="stat-line"><span class="pill">'+esc(r.status||"")+'</span>'
    +(r.tests?'<span class="pill">tests: '+esc(r.tests)+'</span>':'')
    +(r.iterations!=null?'<span class="pill">'+r.iterations+' iter</span>':'')+'</div>';
  if(r.whatShipped) h+='<div class="h4">What shipped</div><div style="color:var(--ink)">'+esc(r.whatShipped)+'</div>';
  if(q){
    h+='<div class="h4">Output quality</div>';
    h+='<div class="bigscore"><span class="v '+scoreCls(q.overall)+'">'+q.overall+'</span>'
      +'<span class="c">weighted from the sections below</span></div>';
    if(q.caps&&q.caps.length) h+='<div class="capwarn">capped at 40 — '+esc(q.caps.join(", "))+'</div>';
    h+=q.dims.map(dimRow).join("");
  }else{
    h+='<div class="h4">Output quality</div><div class="none">Not reviewed yet — no score until the task closes.</div>';
  }
  h+='<div class="h4">Findings</div>';
  h+= anyClosing ? (clist("bugs","Possible bugs",cl.bugs)+clist("","Discovered problems",cl.problems)
        +clist("","Assumptions",cl.assumptions)+clist("","Open issues",cl.issues))
      : '<div class="none">No findings recorded'+(r.status==="done"?'.':' — task is '+esc(r.stage||r.status||"in progress")+'.')+'</div>';
  h+='<div class="path">'+esc(r.recordPath||r.runPath||"")+'</div>';
  return h;
}
function childOutputHtml(r,c){
  let h='<div class="stat-line"><span class="pill">'+esc(c.status||"")+'</span>'
    +(c.model?'<span class="pill">'+esc(c.model)+'</span>':'')+'</div>';
  const tok=fmtTok(c.tokens);
  h+='<div class="kv">who: '+esc(c.who)+'<br>elapsed: '+fmtElapsed(c.started,c.finished)
    +(tok?' · '+tok+' tok':'')+(c.iteration?'<br>iteration: '+esc(c.iteration):'')+'</div>';
  if(c.kind==="agy"){
    const txt=c.result_full||c.result||"";
    h+='<div class="h4">Result</div>'+(txt?'<pre class="out">'+esc(txt)+'</pre>':'<div class="none">No result text'+(c.live?' yet — running.':'.')+'</div>');
  }else{
    h+='<div class="h4">Purpose</div><div style="color:var(--ink)">'+esc(c.label||"—")+'</div>'
      +'<div class="none" style="margin-top:8px">Sub-agent transcript isn\'t captured — only status and tokens.</div>';
  }
  return h;
}
function renderRight(){
  const cx=$("#rightCx"), body=$("#rightBody");
  if(!sel){ cx.textContent=""; body.innerHTML='<div class="hint">Select a task or sub-task to see its output.</div>'; return; }
  const r=findTask(sel.taskKey);
  if(!r){ cx.textContent=""; body.innerHTML='<div class="hint">—</div>'; return; }
  if(sel.childIdx==null){ cx.textContent=r.repo+" · "+r.task; body.innerHTML=taskOutputHtml(r); }
  else{
    const c=r.children[sel.childIdx];
    if(!c){ renderRightTaskFallback(r); return; }
    cx.textContent=c.who+" · "+(c.kind==="agy"?("iter "+(c.iteration||"?")):"sub-agent");
    body.innerHTML=childOutputHtml(r,c);
  }
}
function renderRightTaskFallback(r){ sel.childIdx=null; $("#rightCx").textContent=r.repo+" · "+r.task; $("#rightBody").innerHTML=taskOutputHtml(r); }

/* ---------- selection ---------- */
function ensureSelection(){
  if(sel && findTask(sel.taskKey)){
    const r=findTask(sel.taskKey);
    if(sel.childIdx!=null && !r.children[sel.childIdx]) sel.childIdx=null;
    return;
  }
  const rows=rowsFiltered();
  const pick = rows.find(r=>r.needsAttention) || rows.find(r=>r.live) || rows[0];
  sel = pick ? {taskKey:keyOf(pick), childIdx:null} : null;
  if(pick && pick.children.length) expanded.add(keyOf(pick));
}
function selectTask(k){
  if(!sel||sel.taskKey!==k) traceId=null;      // a trace belongs to one task's graph
  sel={taskKey:k,childIdx:null};
  const r=findTask(k); if(r&&r.children.length) expanded.add(k);
  renderAll();
}
function selectChild(k,i){ sel={taskKey:k,childIdx:i}; renderAll(); }
function toggleExpand(k){ if(expanded.has(k))expanded.delete(k); else expanded.add(k); renderTree(); }

/* ---------- render all ---------- */
function renderAll(){ renderTree(); renderLeft(); renderRight(); }

function apply(payload,preserve){
  const h=JSON.stringify((payload&&payload.runs)||[]);
  if(preserve && h===lastHash) return false;
  lastHash=h;
  const y=preserve?window.scrollY:0;
  PAYLOAD=payload; data=deriveData(payload);
  ensureSelection();
  renderHeader(); renderKpis(); rebuildFilters(); renderAll();
  if(preserve) window.scrollTo(0,y);
  return true;
}

/* ---------- events ---------- */
function bindOnce(){
  $("#themeBtn").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const next=cur==="light"?"dark":(cur==="dark"?"":"light");
    if(next)document.documentElement.setAttribute("data-theme",next);
    else document.documentElement.removeAttribute("data-theme");
  };
  $("#tree").onclick=(ev)=>{
    const row=ev.target.closest(".row"); if(!row) return;
    const k=row.getAttribute("data-k");
    const onCaret=ev.target.closest(".caret");
    if(row.classList.contains("task")){
      if(onCaret && !onCaret.classList.contains("leaf")){ toggleExpand(k); return; }
      selectTask(k);
    }else{
      selectChild(k, +row.getAttribute("data-ci"));
    }
  };
  $("#leftBody").onclick=(ev)=>{
    const it=ev.target.closest(".item"); if(!it) return;
    const id=it.getAttribute("data-id");
    traceId = (traceId===id) ? null : id;   // click again to clear
    applyTrace();
  };
  ["#q","#fStatus","#fRepo"].forEach(s=>$(s).oninput=()=>{ ensureSelection(); renderAll(); });
  $("#fAttn").onchange=()=>{ ensureSelection(); renderAll(); };
}
bindOnce();

if(LIVE){
  const box=$("#live"), txt=$("#liveTxt"), pause=$("#pauseBtn");
  box.classList.add("on"); pause.style.display="";
  let timer=null, paused=false;
  const setState=(cls,t)=>{ box.classList.remove("stale","err"); if(cls)box.classList.add(cls); txt.textContent=t; };
  async function tick(){
    try{
      const res=await fetch("api/runs",{cache:"no-store"});
      if(!res.ok) throw new Error("http "+res.status);
      apply(await res.json(), true);
      setState("", "live · "+new Date().toTimeString().slice(0,8));
    }catch(e){ setState("err","disconnected — retrying"); }
  }
  pause.onclick=()=>{
    paused=!paused;
    if(paused){ clearInterval(timer); timer=null; pause.textContent="▶ resume"; setState("stale","paused"); }
    else{ pause.textContent="⏸ pause"; tick(); timer=setInterval(tick,POLL_MS); }
  };
  tick(); timer=setInterval(tick,POLL_MS);
}else{
  apply(PAYLOAD,false);
}
</script>
